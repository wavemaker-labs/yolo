name: Release
run-name: Release version "${{ github.event.release.tag_name }}"
on:
  release:
    types: [published]
    branches:
      - main
      - master
jobs:
  Supervisely-Release:
    if: "!github.event.release.prerelease"
    # Local replacement for supervisely-ecosystem/workflows/.../common.yml, which
    # requires a runner this org does not have.
    uses: ./.github/workflows/_supervisely_release.yml
    secrets: inherit
    with:
      SLUG: "${{ github.repository }}"
      RELEASE_VERSION: "${{ github.event.release.tag_name }}"
      RELEASE_DESCRIPTION: "${{ github.event.release.name }}"
      RELEASE_TYPE: "release"
      SUBAPP_PATHS: "supervisely_integration/train, supervisely_integration/serve"
      FRAMEWORK: "YOLO"
      MODELS_PATH: "supervisely_integration/models.json"
      # Upstream syncs the model catalog only when the release *title* contains the
      # literal "RELEASE_MODELS". This app's releases carry models.json, so ask for
      # the sync outright rather than relying on a magic string in the title.
      RELEASE_MODELS: true
      # See release_branch.yml: the image check hardcodes the supervisely namespace
      # and needs skopeo, so it cannot run against mpalomata167/yolo here.
      SKIP_IMAGE_VALIDATION: true
      # NOTE: unlike the other two release types, "release" also validates
      # instance_version against the SDK version. It reads that from the image
      # labels - our Dockerfile does set python_sdk_version - but looks the image up
      # under supervisely/, so it falls back to the release description. Every
      # release description must therefore carry a line:
      #     python_sdk_version: 6.74.26
      # Set SKIP_INSTANCE_VERSION_VALIDATION below instead to drop the check.
