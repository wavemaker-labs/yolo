name: Update Models Manual

# Inlined replacement for supervisely-ecosystem/workflows/.../update_models_common.yml,
# which pins `runs-on: gha-runner-supervisely-ecosystem` - a runner registered only to
# the supervisely-ecosystem org - and activates a pre-baked venv on it.
#
# Note the scripts checkout pins `runner-updates`, not master: that is the ref the
# upstream workflow uses for update_models.py.

on:
  workflow_dispatch:

jobs:
  Update-Models:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout release scripts
        uses: actions/checkout@v4
        with:
          repository: supervisely-ecosystem/workflows
          ref: runner-updates
          path: workflow

      # 3.12 or newer is required: release.py uses PEP 701 f-strings (same-type
      # quotes nested inside the expression), which are a SyntaxError before 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release dependencies
        run: pip install -r workflow/requirements.txt

      - name: Resolve models path and framework
        run: python workflow/get_inputs.py
        env:
          MODELS_PATH: supervisely_integration/models.json
          FRAMEWORK: YOLO

      - name: Update models
        # get_inputs.py exported FRAMEWORK and MODELS_PATH through GITHUB_ENV.
        run: python workflow/update_models.py
        env:
          SUPERVISELY_PROD_SERVER_ADDRESS: "${{ vars.SUPERVISELY_PROD_SERVER_ADDRESS }}"
          SUPERVISELY_PROD_API_TOKEN: "${{ secrets.SUPERVISELY_PROD_API_TOKEN }}"
