name: Release branch
run-name: Release "${{ github.ref_name }}" branch
on:
  push:
    branches-ignore:
      - main
      - master
      - "sly-version-update-v-*"
jobs:
  Supervisely-Release:
    # Local replacement for supervisely-ecosystem/workflows/.../common.yml, which
    # requires a runner this org does not have. Credentials are read inside it from
    # repo secrets and variables, so they are no longer threaded through here.
    uses: ./.github/workflows/_supervisely_release.yml
    secrets: inherit
    with:
      SLUG: "${{ github.repository }}"
      RELEASE_VERSION: "${{ github.ref_name }}"
      RELEASE_DESCRIPTION: "'${{ github.ref_name }}' branch release"
      RELEASE_TYPE: "release-branch"
      SUBAPP_PATHS: "supervisely_integration/train, supervisely_integration/serve"
